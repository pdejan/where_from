name: Release

# Publishes a GitHub release whenever the TOC's ## Version changes to a version
# that has no release yet. Can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: [WhereFrom.toc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from TOC
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' WhereFrom.toc | tr -d '\r[:space:]')
          if [ -z "$version" ]; then
            echo "::error::No '## Version:' line found in WhereFrom.toc"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Tracked files only, inside a WhereFrom/ folder; .gitattributes
        # keeps repo-only files (.github, .gitignore, ...) out of the archive.
        run: |
          git archive --format=zip --prefix=WhereFrom/ -o "WhereFrom_${VERSION}.zip" HEAD
          unzip -l "WhereFrom_${VERSION}.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" "WhereFrom_${VERSION}.zip" \
            --title "Where From? $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
